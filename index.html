<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a Request — Creative Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-mark">infinix · creative desk</div>
      <h1>Job Ticket Board</h1>
      <div class="sub">// submit a request or check where yours stands</div>
    </div>
    <nav>
      <button class="active" data-view="form">New Request</button>
      <button data-view="track">Track</button>
      <button data-view="status">Status</button>
    </nav>
  </header>

  <div class="stats-mini" id="stats-mini">
    <span id="sm-open">–</span> open right now &nbsp;·&nbsp; <span id="sm-done">–</span> done this month
  </div>

  <!-- FORM -->
  <div class="view active" id="form">
    <div class="panel">
      <h2>New Job Ticket</h2>
      <div class="hint">// the artist gets notified the second this lands</div>
      <div class="field"><label>Your name</label><input type="text" id="f-name" placeholder="Juan dela Cruz"></div>
      <div class="field"><label>Your email</label><input type="email" id="f-email" placeholder="juan@infinix.com"></div>
      <div class="field"><label>Project title</label><input type="text" id="f-title" placeholder="Q4 product launch banner set"></div>
      <div class="field"><label>Brief</label><textarea id="f-brief" placeholder="Dimensions, platform, must-haves..."></textarea></div>
      <div class="field"><label>Reference link (optional)</label><input type="text" id="f-reference" placeholder="Link to a reference image, drive folder, etc."></div>
      <div class="field"><label>Needed by</label><input type="date" id="f-deadline"></div>
      <button class="btn" id="f-submit">Submit Ticket →</button>
      <div id="f-result" class="result-msg"></div>
    </div>
  </div>

  <!-- TRACK -->
  <div class="view" id="track">
    <div class="track-box">
      <div class="track-row">
        <input type="text" id="tr-id" placeholder="Enter your ticket ID (e.g. REQ-0219)">
        <button id="tr-check">Check</button>
      </div>
      <div id="tr-result"></div>
    </div>
  </div>

  <!-- STATUS -->
  <div class="view" id="status">
    <div id="status-loading" class="empty-msg">Loading…</div>
    <div class="board" id="status-board"></div>
  </div>

</div>

<!-- READ-ONLY DETAIL MODAL -->
<div class="overlay" id="status-overlay" onclick="if(event.target===this) closeStatusDetail()">
  <div class="modal">
    <button class="modal-close" onclick="closeStatusDetail()">✕ close</button>
    <div class="t-id" id="sd-id">REQ-0000</div>
    <h3 id="sd-title">Title</h3>
    <div class="modal-row"><span id="sd-req">Requestor</span><span id="sd-due">Due</span></div>
    <div class="modal-brief" id="sd-brief">Brief text</div>
    <div id="sd-ref-row" style="display:none; margin:-8px 0 16px;"></div>
    <div id="sd-file-row" style="display:none; margin:-8px 0 16px;"></div>
    <div id="sd-notes-row" style="display:none;"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="request.js"></script>
</body>
</html>
