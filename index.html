<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Ticket Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="brand-mark">infinix · creative desk</div>
      <h1>Job Ticket Board</h1>
      <div class="sub">// requests come in, tickets get worked, requestors get pinged</div>
    </div>
    <nav>
      <button class="active" data-view="dashboard">Board</button>
      <button data-view="form">New Request</button>
      <button data-view="track">Track</button>
    </nav>
  </header>

  <!-- DASHBOARD -->
  <div class="view active" id="dashboard">
    <div class="board" id="board">
      <div>
        <div class="col-head"><span class="col-title">Pending</span><span class="col-line"></span><span class="col-count" id="count-pending">0</span></div>
        <div id="col-pending"></div>
      </div>
      <div>
        <div class="col-head"><span class="col-title">Ongoing</span><span class="col-line"></span><span class="col-count" id="count-ongoing">0</span></div>
        <div id="col-ongoing"></div>
      </div>
      <div>
        <div class="col-head"><span class="col-title">Done</span><span class="col-line"></span><span class="col-count" id="count-done">0</span></div>
        <div id="col-done"></div>
      </div>
      <div>
        <div class="col-head"><span class="col-title">Cancelled</span><span class="col-line"></span><span class="col-count" id="count-void">0</span></div>
        <div id="col-void"></div>
      </div>
    </div>
    <div id="board-empty" class="empty-msg" style="display:none;">No tickets yet.</div>
    <div id="board-loading" class="empty-msg">Loading tickets…</div>
  </div>

  <!-- FORM -->
  <div class="view" id="form">
    <div class="panel">
      <h2>New Job Ticket</h2>
      <div class="hint">// the artist gets notified the second this lands</div>
      <div class="field"><label>Your name</label><input type="text" id="f-name" placeholder="Juan dela Cruz"></div>
      <div class="field"><label>Your email</label><input type="email" id="f-email" placeholder="juan@infinix.com"></div>
      <div class="field"><label>Project title</label><input type="text" id="f-title" placeholder="Q4 product launch banner set"></div>
      <div class="field"><label>Brief</label><textarea id="f-brief" placeholder="Dimensions, platform, references, must-haves..."></textarea></div>
      <div class="field"><label>Needed by</label><input type="date" id="f-deadline"></div>
      <button class="btn" id="f-submit">Submit Ticket →</button>
      <div id="f-result" class="result-msg"></div>
    </div>
  </div>

  <!-- TRACK -->
  <div class="view" id="track">
    <div class="track-box">
      <div class="track-row">
        <input type="text" id="tr-id" placeholder="Enter your ticket ID (e.g. REQ-0219)">
        <button id="tr-check">Check</button>
      </div>
      <div id="tr-result"></div>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕ close</button>
    <div class="t-id" id="m-id">REQ-0000</div>
    <h3 id="m-title">Title</h3>
    <div class="modal-row"><span id="m-req">Requestor</span><span id="m-due">Due</span></div>
    <div class="modal-brief" id="m-brief">Brief text</div>

    <div class="status-row">
      <button class="status-btn" data-s="Pending" onclick="setStatus('Pending')">Pending</button>
      <button class="status-btn" data-s="Ongoing" onclick="setStatus('Ongoing')">Ongoing</button>
      <button class="status-btn" data-s="Done" onclick="setStatus('Done')">Done</button>
      <button class="status-btn" data-s="Cancelled" onclick="setStatus('Cancelled')">Cancel</button>
    </div>

    <div class="attach-box" id="attach-box">
      <label>File link (poster, design, etc.)</label>
      <input type="text" id="attach-input" placeholder="https://drive.google.com/...">
    </div>

    <button class="confirm-btn" id="confirm-btn" onclick="confirmStatus()">Save & Notify</button>
  </div>
</div>

<div class="toast" id="toast">✓ Saved</div>

<script src="app.js"></script>
</body>
</html>
